    <text x="28" y="42" fill="#ffffff">ALI · 国际站</text>
    <rect x="181" width="177" height="68" rx="5" fill="#0e7b83"/>
    <text x="207" y="42" fill="#ffffff">WEB · 独立站</text>
    <rect x="379" width="194" height="68" rx="5" fill="#e36637"/>
    <text x="405" y="42" fill="#ffffff">MIC · 中国制造</text>
  </g>
  <g transform="translate(780 189)">
    <rect width="302" height="311" rx="8" fill="#081c2c"/>
    <text x="24" y="40" fill="#9eb0bc" font-family="Consolas, monospace" font-size="13" letter-spacing="2">OPERATIONS LEDGER</text>
    <line x1="24" y1="62" x2="278" y2="62" stroke="#294252"/>
    <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">
