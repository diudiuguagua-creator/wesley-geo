<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Wesley GEO 外贸 B2B 代运营</title>
  <desc id="desc">Alibaba 国际站、独立站和中国制造网运营框架</desc>
  <rect width="1200" height="630" fill="#ecf2f6"/>
  <rect x="48" y="48" width="1104" height="534" rx="10" fill="#fcfeff" stroke="#aebfc9" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="78" rx="10" fill="#081c2c"/>
  <rect x="48" y="112" width="1104" height="14" fill="#081c2c"/>
  <g transform="translate(86 76)">
    <rect x="0" y="18" width="10" height="18" fill="#2155d7"/>
    <rect x="17" y="4" width="10" height="32" fill="#2155d7"/>
    <rect x="34" y="12" width="10" height="24" fill="#e36637"/>
    <text x="64" y="31" fill="#ffffff" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">Wesley GEO</text>
  </g>
  <text x="88" y="213" fill="#2155d7" font-family="Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3">FOREIGN TRADE B2B OPERATIONS</text>
  <text x="84" y="293" fill="#081c2c" font-family="Arial, Microsoft YaHei, sans-serif" font-size="56" font-weight="800">外贸 B2B 代运营</text>
  <text x="88" y="351" fill="#405766" font-family="Arial, Microsoft YaHei, sans-serif" font-size="26">让渠道动作变得可执行、可追踪、可复盘</text>
  <g transform="translate(88 414)" font-family="Consolas, monospace" font-size="18" font-weight="700">
